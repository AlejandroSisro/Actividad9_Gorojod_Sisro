<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Trilogía de The Dark Knight</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="">Página principal</a></li>
                <li><a href="">Películas</a></li>
                <li><a href="">Personajes</a></li>
                <li><a href="">Vehículos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Trilogia de The Dark Knight</h1>
        <h2>Películas</h2>
        <section class="gridContenedor">
            <div class="BatmanBegins">
                <img src="Imagenes/Batman_Begins_Poster.jpg" alt="Poster de Batman Begins">
                <h3>BATMAN BEGINS</h3>
                <h4>El mal teme al caballero</h4>
            </div>
            <div class="DarkKnight">
                <img src="Imagenes/The_Dark_Knight_(2008_film).jpg" alt="Poster de The Dark Knight">
                <h3>THE DARK KNIGHT</h3>
                <h4>Bienvenidos a un mundo sin reglas.</h4>
            </div>
            <div class="DarkKnightRises">
                <img src="Imagenes/Dark_knight_rises_poster.jpg" alt="Poster de The Dark Knight rises">
                <h3>THE DARK KNIGHT RISES</h3>
                <h4>La leyenda termina</h4>
            </div>
        </section>
    </main>
</body>
</html>
